AWSTemplateFormatVersion: '2010-09-09'
Description: Restore an encrypted staging RDS PostgreSQL instance to one UTC instant in a private verifier-only network.

Parameters:
  SourceDbiResourceId:
    Type: String
    AllowedPattern: 'db-[A-Za-z0-9]+'
    Description: Immutable DbiResourceId of the staging instance checked by staging-preflight.
  RestoreTime:
    Type: String
    AllowedPattern: '[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]{1,6})?Z'
    Description: Verified UTC time between the two committed staging markers.
  DBInstanceClass:
    Type: String
    AllowedPattern: 'db\.[a-z0-9]+\.[a-z0-9]+'
    Description: Orderable instance class for the source engine version in Seoul.
  PrivateDBSubnetGroupName:
    Type: String
    Description: Existing private IPv4 DB subnet group in the specified VPC.
  VpcId:
    Type: AWS::EC2::VPC::Id
  VerifierSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Dedicated verifier security group in the same VPC with no API or worker tasks attached.

  ManageVerifierEgress:
    Type: String
    AllowedValues: ['false', 'true']
    Default: 'false'
    Description: Add outbound TCP 5432 to this restored DB on the dedicated verifier group for this drill.

Conditions:
  AddVerifierEgress: !Equals [!Ref ManageVerifierEgress, 'true']

Rules:
  VerifierInTargetVpc:
    Assertions:
      - Assert:
          Fn::EachMemberIn:
            - Fn::ValueOfAll: ['AWS::EC2::SecurityGroup::Id', VpcId]
            - Fn::RefAll: 'AWS::EC2::VPC::Id'
        AssertDescription: The verifier security group must belong to the selected VPC.

Resources:
  RestoreSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Allow PostgreSQL from the staging recovery verifier only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref VerifierSecurityGroupId
      # An empty egress list creates EC2's default allow-all rule. Use a
      # loopback-only rule; replies to allowed inbound connections are stateful.
      SecurityGroupEgress:
        - IpProtocol: '-1'
          CidrIp: 127.0.0.1/32

  VerifierToRestore:
    Type: AWS::EC2::SecurityGroupEgress
    Condition: AddVerifierEgress
    Properties:
      GroupId: !Ref VerifierSecurityGroupId
      IpProtocol: tcp
      FromPort: 5432
      ToPort: 5432
      DestinationSecurityGroupId: !GetAtt RestoreSecurityGroup.GroupId

  RestoredDB:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      # Let CloudFormation allocate a new DB identifier for each drill.
      # RDS restores encrypted storage with the source key.
      SourceDbiResourceId: !Ref SourceDbiResourceId
      RestoreTime: !Ref RestoreTime
      DBInstanceClass: !Ref DBInstanceClass
      DBSubnetGroupName: !Ref PrivateDBSubnetGroupName
      VPCSecurityGroups: [!GetAtt RestoreSecurityGroup.GroupId]
      Port: '5432'
      NetworkType: IPV4
      PubliclyAccessible: false
      MultiAZ: false
      BackupRetentionPeriod: 0
      DeleteAutomatedBackups: true
      DeletionProtection: false

Outputs:
  RestoredDBIdentifier:
    Description: Identifier of the disposable restored DB for verification and evidence.
    Value: !Ref RestoredDB
