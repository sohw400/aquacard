AWSTemplateFormatVersion: '2010-09-09'
Description: Private HTTPS entry for the Seoul synthetic member API and signed card webhook.

Parameters:
  VpcId: { Type: 'AWS::EC2::VPC::Id' }
  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Both private subnets from the staging network stack.
  ClientSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Approved private test client or VPN endpoint security group in the VPC.
  CertificateArn:
    Type: String
    AllowedPattern: 'arn:aws:acm:ap-northeast-2:[0-9]{12}:certificate/[a-f0-9-]+'
    Description: Issued private staging hostname certificate in Seoul.

Rules:
  SeoulOnly:
    Assertions:
      - Assert: !Equals [!Ref 'AWS::Region', ap-northeast-2]
        AssertDescription: This edge is for the Seoul staging VPC.

Resources:
  EdgeGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Internal Aqua HTTPS listener for explicitly approved staging clients
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, SourceSecurityGroupId: !Ref ClientSecurityGroupId }
      # Each HTTP service stack installs only its own outbound listener-to-task rule.
      SecurityGroupEgress:
        - { IpProtocol: '-1', CidrIp: 127.0.0.1/32 }
  Edge:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internal
      Type: application
      IpAddressType: ipv4
      Subnets: !Ref PrivateSubnetIds
      SecurityGroups: [!GetAtt EdgeGroup.GroupId]
      LoadBalancerAttributes:
        - { Key: routing.http.drop_invalid_header_fields.enabled, Value: 'true' }
        - { Key: routing.http.desync_mitigation_mode, Value: strictest }
  ApiTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3001
      TargetType: ip
      HealthCheckPath: /api/health
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: '30' }]
  IngressTargets:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 3004
      TargetType: ip
      HealthCheckPath: /health
      Matcher: { HttpCode: '200' }
      TargetGroupAttributes: [{ Key: deregistration_delay.timeout_seconds, Value: '30' }]
  TlsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref Edge
      Protocol: HTTPS
      Port: 443
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates: [{ CertificateArn: !Ref CertificateArn }]
      DefaultActions: [{ Type: forward, TargetGroupArn: !Ref ApiTargets }]
  WebhookRoute:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref TlsListener
      Priority: 1
      Conditions:
        - { Field: path-pattern, Values: [/webhooks/sandbox/cards] }
        - { Field: http-request-method, HttpRequestMethodConfig: { Values: [POST] } }
      Actions: [{ Type: forward, TargetGroupArn: !Ref IngressTargets }]

Outputs:
  PrivateDnsTarget: { Value: !GetAtt Edge.DNSName }
  CanonicalHostedZoneId: { Value: !GetAtt Edge.CanonicalHostedZoneID }
  EdgeSecurityGroupId: { Value: !GetAtt EdgeGroup.GroupId }
  ApiTargetGroupArn: { Value: !Ref ApiTargets }
  IngressTargetGroupArn: { Value: !Ref IngressTargets }
