name: Check server sandbox

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: server-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-bookworm@sha256:ece55f7868da684e400f82f1030a050718adbdd65c23aa500c486f6e2950dc0f
        env:
          POSTGRES_USER: aqua
          POSTGRES_PASSWORD: aqua_local_only
          POSTGRES_DB: aqua
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U aqua -d aqua"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      AQUA_BASE_URL: http://127.0.0.1:5173
      DATABASE_URL: postgresql://aqua_app:aqua_app_local_only@127.0.0.1:5432/aqua
      MIGRATION_DATABASE_URL: postgresql://aqua:aqua_local_only@127.0.0.1:5432/aqua
      DATABASE_RUNTIME_ROLE: aqua_app
      DATABASE_WORKER_ROLE: aqua_worker
      DATABASE_INGRESS_ROLE: aqua_ingress
      DATABASE_DISPATCHER_ROLE: aqua_dispatcher
      DATABASE_OPERATIONS_ROLE: aqua_operations
      DATABASE_SETTLEMENT_ROLE: aqua_settlement
      SETTLEMENT_DATABASE_URL: postgresql://aqua_settlement:aqua_settlement_local_only@127.0.0.1:5432/aqua
      DATABASE_MONITOR_ROLE: aqua_monitor
      MONITOR_DATABASE_URL: postgresql://aqua_monitor:aqua_monitor_local_only@127.0.0.1:5432/aqua
      DATABASE_AUTH_MAIL_ROLE: aqua_auth_mail
      AUTH_MAIL_DATABASE_URL: postgresql://aqua_auth_mail:aqua_auth_mail_local_only@127.0.0.1:5432/aqua
      OPERATIONS_DATABASE_URL: postgresql://aqua_operations:aqua_operations_local_only@127.0.0.1:5432/aqua
      DISPATCHER_DATABASE_URL: postgresql://aqua_dispatcher:aqua_dispatcher_local_only@127.0.0.1:5432/aqua
      INGRESS_DATABASE_URL: postgresql://aqua_ingress:aqua_ingress_local_only@127.0.0.1:5432/aqua
      WORKER_DATABASE_URL: postgresql://aqua_worker:aqua_worker_local_only@127.0.0.1:5432/aqua
      DATABASE_SCHEMA: aqua_browser_ci
      TEST_DATABASE_URL: postgresql://aqua:aqua_local_only@127.0.0.1:5432/aqua
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Set the isolated developer mailbox
        shell: bash
        run: |
          printf 'AQUA_MAIL_DIR=%s\n' "$RUNNER_TEMP/aqua-server-check/mail" >> "$GITHUB_ENV"
      - name: Check monitoring infrastructure and alarm metrics
        shell: bash
        run: |
          python3 -m venv "$RUNNER_TEMP/aqua-cfn"
          source "$RUNNER_TEMP/aqua-cfn/bin/activate"
          python -m pip install --disable-pip-version-check cfn-lint==1.40.4
          cfn-lint --regions ap-northeast-2 --template infra/operations-monitoring.yaml infra/staging-pitr.yaml infra/staging-network.yaml infra/staging-foundation.yaml infra/staging-bootstrap.yaml
          python -B -m unittest discover -s scripts -p "test_*template.py"
          node --import tsx scripts/check-operations-alarms.mjs
      - name: Verify trust bundle packaging
        run: node --test scripts/rds-ca.test.mjs
      - name: Check server types
        run: npm run typecheck:server
      - name: Bootstrap the isolated test application role
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFile } from 'node:fs/promises';
          import { Client } from 'pg';
          const aquaBootstrap = new Client({ connectionString: process.env.MIGRATION_DATABASE_URL });
          try {
            await aquaBootstrap.connect();
            await aquaBootstrap.query(await readFile('docker/postgres-init.sql', 'utf8'));
          } finally {
            await aquaBootstrap.end();
          }
          JS
      - name: Apply application migrations
        run: npm run db:migrate
      - name: Check server behavior
        run: npm run test:server
      - name: Restore a synthetic PostgreSQL backup into a fresh cluster
        run: npm run test:recovery
      - name: Recover a disposable physical backup to the selected transaction time
        run: npm run test:pitr
      - name: Check read-only staging evidence collection
        run: python3 -B -m unittest discover -s scripts -p test_staging_preflight.py
      - name: Check existing product logic
        run: npm test
      - name: Build the public demo
        run: npm run build
      - name: Build the connected client
        run: npm run build:connected
      - name: Compile the server and migration runner
        run: npm run build:server
      - name: Build the release container with a test trust anchor
        shell: bash
        run: |
          aqua_test_ca="$RUNNER_TEMP/aqua-ci-ca.pem"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj /CN=Aqua-CI \
            -addext basicConstraints=critical,CA:TRUE -keyout /dev/null -out "$aqua_test_ca" 2>/dev/null
          read -r aqua_ca_hash _ < <(sha256sum "$aqua_test_ca")
          docker buildx build --load --no-cache-filter rds-trust \
            --secret "id=rds_ca,src=$aqua_test_ca" --build-arg "RDS_CA_SHA256=$aqua_ca_hash" \
            --tag aqua-card-server:ci .
          docker run --rm --read-only --entrypoint node aqua-card-server:ci --input-type=module -e '
            import assert from "node:assert/strict";
            import { createHash } from "node:crypto";
            import { readFileSync, statSync } from "node:fs";
            const path = "/etc/aqua/rds-ca.pem";
            assert.notEqual(process.getuid(), 0);
            assert.equal(statSync(path).mode & 0o777, 0o444);
            assert.equal(createHash("sha256").update(readFileSync(path)).digest("hex"), process.argv[1]);
          ' "$aqua_ca_hash"
      - name: Initialize a private PostgreSQL fixture from the release image
        run: bash scripts/staging-bootstrap-smoke.sh aqua-card-server:ci
      - name: Check the compiled container with a read-only filesystem
        shell: bash
        run: |
          aqua_container="aqua-server-check-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          trap 'docker rm --force "$aqua_container" > /dev/null 2>&1 || true' EXIT
          docker run --detach --name "$aqua_container" --network host --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e DATABASE_URL -e DATABASE_SCHEMA \
            -e AQUA_HOST=127.0.0.1 -e AQUA_PORT=3002 \
            -e AQUA_ALLOWED_ORIGINS=http://127.0.0.1:3002 -e AQUA_MAIL_DIR=/tmp/aqua-mail \
            aqua-card-server:ci
          aqua_ready=false
          for ((aqua_attempt=0; aqua_attempt<30; aqua_attempt++)); do
            if curl --fail --silent http://127.0.0.1:3002/api/health > /dev/null && curl --fail --silent http://127.0.0.1:3002/ > /dev/null; then
              aqua_ready=true
              break
            fi
            if [[ "$(docker inspect --format '{{.State.Running}}' "$aqua_container")" != true ]]; then
              break
            fi
            sleep 1
          done
          if [[ "$aqua_ready" != true ]]; then
            docker logs "$aqua_container"
            exit 1
          fi
          docker exec --interactive "$aqua_container" node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { existsSync } from 'node:fs';
          assert.notEqual(process.getuid(), 0);
          assert.equal(existsSync('/app/.env'), false);
          assert.equal('NODE_EXTRA_CA_CERTS' in process.env, false);
          const base = 'http://127.0.0.1:3002';
          for (const probe of ['/api/live', '/api/health']) assert.equal((await fetch(base + probe)).status, 200);
          const page = await fetch(base);
          assert.equal(page.status, 200);
          const html = await page.text();
          assert.match(html, /<title>Aqua Card/);
          const assets = [...html.matchAll(/(?:src|href)="([^"]+\.(?:js|css))"/g)];
          assert.ok(assets.length > 0);
          for (const [, asset] of assets) assert.equal((await fetch(new URL(asset, base))).status, 200);
          console.log('Non-root compiled API, connected assets and secret exclusion passed.');
          JS
          docker run --rm --network host --read-only --no-healthcheck --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e WORKER_DATABASE_URL -e DATABASE_SCHEMA \
            aqua-card-server:ci node dist-server/card-worker.js --once
          docker run --rm --network host --read-only --no-healthcheck --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e MONITOR_DATABASE_URL -e DATABASE_SCHEMA -e AQUA_MONITOR_ENVIRONMENT=ci \
            aqua-card-server:ci node dist-server/operations-monitor.js | node --input-type=module -e '
              import assert from "node:assert/strict";
              let input = ""; for await (const chunk of process.stdin) input += chunk;
              const event = JSON.parse(input);
              assert.equal(event.Environment, "ci");
              assert.equal(event.MonitorHealthy, 1);
              assert.equal(event.LedgerFindings, 0);
              assert.equal(event.CardInboxDueCount, 0);
            '
          aqua_statement="$RUNNER_TEMP/closed-issuer-statement.json"
          printf '%s\n' '{"version":1,"businessDate":"2025-11-26","currency":"TEST_KRW","controls":{"rowCount":0,"capturedWon":"0","refundedWon":"0"},"rows":[]}' > "$aqua_statement"
          chmod 0444 "$aqua_statement"
          docker run --rm --network host --read-only --no-healthcheck --cap-drop ALL --security-opt no-new-privileges \
            --mount "type=bind,src=$aqua_statement,dst=/statement.json,readonly" \
            -e NODE_ENV=development -e SETTLEMENT_DATABASE_URL -e DATABASE_SCHEMA \
            aqua-card-server:ci node dist-server/reconcile-issuer-statement.js /statement.json | \
            node --input-type=module -e '
              import assert from "node:assert/strict";
              import { createHash } from "node:crypto";
              import { readFileSync } from "node:fs";
              let input = ""; for await (const chunk of process.stdin) input += chunk;
              const report = JSON.parse(input);
              assert.equal(report.ok, true);
              assert.equal(report.matchedEventCount, 0);
              assert.equal(report.statementSha256, createHash("sha256").update(readFileSync(process.argv[1])).digest("hex"));
            ' "$aqua_statement"
          aqua_report="$(docker run --rm --network host --read-only --no-healthcheck --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e OPERATIONS_DATABASE_URL -e DATABASE_SCHEMA \
            aqua-card-server:ci node dist-server/card-operations-operator.js \
            trace-event ci-no-card-event 00000000-0000-4000-8000-000000000008 CI-OPS-SMOKE)"
          printf '%s' "$aqua_report" | node --input-type=module -e '
            import assert from "node:assert/strict";
            let input = ""; for await (const chunk of process.stdin) input += chunk;
            const report = JSON.parse(input);
            assert.equal(report.found, false);
            assert.equal(report.correlation, "not_found");
            assert.equal(report.requestId, "00000000-0000-4000-8000-000000000008");
          '
          aqua_replayed_report="$(docker run --rm --network host --read-only --no-healthcheck --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e OPERATIONS_DATABASE_URL -e DATABASE_SCHEMA \
            aqua-card-server:ci node dist-server/card-operations-operator.js \
            read 00000000-0000-4000-8000-000000000008)"
          test "$aqua_report" = "$aqua_replayed_report"
          docker run --rm --network host --read-only --no-healthcheck --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e DISPATCHER_DATABASE_URL -e DATABASE_SCHEMA \
            aqua-card-server:ci node --input-type=module -e '
              import { randomBytes } from "node:crypto";
              process.env.AQUA_ISSUER_SANDBOX_URL = "http://127.0.0.1:1";
              process.env.AQUA_ISSUER_KEY_ID = "ci";
              process.env.AQUA_ISSUER_SIGNING_KEY = randomBytes(32).toString("base64url");
              process.argv = [process.execPath, "dist-server/issuer-dispatcher.js", "--once"];
              await import("./dist-server/issuer-dispatcher.js");
            '
          docker run --rm --network host --read-only --no-healthcheck \
            --tmpfs /tmp:rw,noexec,nosuid,size=16m --cap-drop ALL --security-opt no-new-privileges \
            -e NODE_ENV=development -e AUTH_MAIL_DATABASE_URL -e DATABASE_SCHEMA \
            aqua-card-server:ci node --input-type=module -e '
              import { randomBytes } from "node:crypto";
              process.env.AQUA_AUTH_MAIL_KEYS = JSON.stringify({ ci: randomBytes(32).toString("base64") });
              process.env.AQUA_AUTH_MAIL_ACTIVE_KEY = "ci";
              process.env.AQUA_AUTH_MAIL_TRANSPORT = "file";
              process.env.AQUA_MAIL_DIR = "/tmp/aqua-mail";
              process.argv = [process.execPath, "dist-server/auth-mail-worker.js", "--once"];
              await import("./dist-server/auth-mail-worker.js");
            '
      - name: Locate a browser for the connected flow
        shell: bash
        run: |
          aqua_browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [[ -z "$aqua_browser" ]]; then
            ./node_modules/.bin/playwright-core install --with-deps chromium
            aqua_browser="$(node --input-type=module -e 'import { chromium } from "playwright-core"; process.stdout.write(chromium.executablePath())')"
          fi
          printf 'CHROMIUM_PATH=%s\n' "$aqua_browser" >> "$GITHUB_ENV"
      - name: Check the connected browser flow
        shell: bash
        run: |
          mkdir -p "$AQUA_MAIL_DIR"
          NODE_ENV=development npm run server:start > "$RUNNER_TEMP/aqua-api.log" 2>&1 &
          aqua_api_pid=$!
          npm run dev:server > "$RUNNER_TEMP/aqua-web.log" 2>&1 &
          aqua_web_pid=$!
          cleanup() {
            aqua_status=$?
            kill "$aqua_api_pid" "$aqua_web_pid" 2>/dev/null || true
            if [[ "$aqua_status" -ne 0 ]]; then
              cat "$RUNNER_TEMP/aqua-api.log" "$RUNNER_TEMP/aqua-web.log"
            fi
          }
          trap cleanup EXIT
          aqua_ready=false
          for ((aqua_attempt=0; aqua_attempt<60; aqua_attempt++)); do
            if curl --fail --silent http://127.0.0.1:3001/api/health > /dev/null && curl --fail --silent "$AQUA_BASE_URL" > /dev/null; then
              aqua_ready=true
              break
            fi
            if ! kill -0 "$aqua_api_pid" 2>/dev/null || ! kill -0 "$aqua_web_pid" 2>/dev/null; then
              break
            fi
            sleep 1
          done
          if [[ "$aqua_ready" != true ]]; then
            printf 'The API and connected client did not become ready.\n' >&2
            exit 1
          fi
          npm run test:server:browser
          npm run test:card:browser
          npm run test:rewards:browser
          npm run server:reconcile
      - name: Check connected issuer controls in an isolated schema
        run: npm run test:issuer:browser
      - name: Check customer access and session security in an isolated schema
        run: npm run test:security:browser
      - name: Check email verification and queued recovery in an isolated schema
        run: npm run test:email:browser
