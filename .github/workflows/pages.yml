name: Deploy Aqua Card to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  MOBILE_PREVIEW_REF: 1791880c43147a3e01963d2c2832f1d935f8bdb8

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Check product logic
        run: npm test
      - name: Read Pages configuration
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Build the public site
        run: npm run build -- --base="${{ steps.pages.outputs.base_path }}/"
      - name: Check out the reviewed mobile preview
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MOBILE_PREVIEW_REF }}
          path: mobile-preview-source
          persist-credentials: false
      - name: Build the preview in its own directory
        working-directory: mobile-preview-source
        env:
          PAGES_BASE: ${{ steps.pages.outputs.base_path }}
        run: |
          npm ci --no-audit --no-fund
          npm test
          npm run build -- --mode mobile-preview --base="$PAGES_BASE/preview/pr-26/"
          mkdir -p ../dist/preview
          mv dist ../dist/preview/pr-26
      - name: Upload static site
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

  check-mobile-preview:
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.MOBILE_PREVIEW_REF }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Open the published sign-up and issued-card scenarios
        env:
          SITE_URL: ${{ needs.deploy.outputs.page_url }}
        run: |
          export MOBILE_PREVIEW_URL="${SITE_URL%/}/preview/pr-26/"
          export CHROMIUM_PATH="$(command -v google-chrome)"
          curl --fail --silent --show-error --retry 10 --retry-delay 4 --retry-all-errors --max-time 15 -o /dev/null "$MOBILE_PREVIEW_URL"
          node scripts/mobile-preview-check.mjs
